---
- name: Building a Java application
  hosts: builder
  become: yes
  tasks:
    - name: Installing Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Installing python3-docker (required by community.docker modules)
      apt:
        name: python3-docker
        state: present
        update_cache: yes

    - name: Cloning a repository from GitHub
      git:
        repo: "https://github.com/alxfli/App42PaaS.git"
        dest: /home/ubuntu/app
        version: main

    - name: Building a Docker image
      community.docker.docker_image:
        name: app42-web
        tag: latest
        source: build
        build:
          path: /home/ubuntu/app

    - name: Saving the image to an archive
      community.docker.docker_image:
        name: app42-web:latest
        archive_path: /home/ubuntu/app42-web.tar
        source: local

    - name: Retrieve the archive to the management machine
      fetch:
        src: /home/ubuntu/app42-web.tar
        dest: /tmp/app42-web.tar
        flat: yes

- name: Launch to prod
  hosts: prod
  become: yes
  tasks:
    - name: Installing Docker
      apt:
        name: docker.io
        state: present
        update_cache: yes

    - name: Installing python3-docker (required by community.docker modules)
      apt:
        name: python3-docker
        state: present
        update_cache: yes

    - name: Copying the archive to the production machine
      copy:
        src: /tmp/app42-web.tar
        dest: /home/ubuntu/app42-web.tar

    - name: Loading image
      community.docker.docker_image:
        name: app42-web:latest
        source: load
        load_path: /home/ubuntu/app42-web.tar

    - name: Creating a dedicated Docker network for the app stack
      community.docker.docker_network:
        name: app42-net
        state: present

    - name: Starting MySQL container
      community.docker.docker_container:
        name: app42-db
        image: mysql:5.7
        state: started
        restart_policy: always
        networks:
          - name: app42-net
        ports:
          - "3306:3306"
        env:
          MYSQL_ROOT_PASSWORD: "{{ db_password | default('changeme') }}"
          MYSQL_DATABASE: "{{ db_name | default('appdb') }}"
          MYSQL_ROOT_HOST: "%"
        volumes:
          - app42_db_data:/var/lib/mysql

    - name: Waiting for MySQL to accept connections
      community.docker.docker_container_exec:
        container: app42-db
        command: mysqladmin ping -h localhost -uroot -p{{ db_password | default('changeme') }}
      register: mysql_ping
      until: mysql_ping.rc == 0
      retries: 20
      delay: 5
      changed_when: false

    - name: Starting the application container
      community.docker.docker_container:
        name: app42-web
        image: app42-web:latest
        state: started
        restart_policy: always
        networks:
          - name: app42-net
        ports:
          - "80:8080"
        env:
          DB_HOST: "app42-db"
          DB_PORT: "3306"
          DB_USER: "root"
          DB_PASSWORD: "{{ db_password | default('changeme') }}"
          DB_NAME: "{{ db_name | default('appdb') }}"
